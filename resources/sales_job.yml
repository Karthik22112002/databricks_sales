resources:
  jobs:
    sales_etl_job:
      name: sales_etl_job
      
      # Remove job_clusters entirely and use serverless compute for tasks
      tasks:
        - task_key: bronze_ingestion
          existing_cluster_id: "" # Or omit cluster keys if serverless is default, or use serverless syntax
          notebook_task:
            notebook_path: ../src/01_bronze_ingestion.ipynb

        - task_key: silver_cleaning
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: sales_job_cluster
          notebook_task:
            notebook_path: ../src/02_silver_cleaning.ipynb

        - task_key: gold_analytics
          depends_on:
            - task_key: silver_cleaning
          job_cluster_key: sales_job_cluster
          notebook_task:
            notebook_path: ../src/03_gold_analytics.ipynb