resources:
  jobs:
    sales_etl_job:
      name: sales_etl_job
      
      # Automatically spins up a compute cluster for the duration of the job run
      job_clusters:
        - job_cluster_key: sales_job_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1

      tasks:
        # Task 1: Bronze Ingestion
        - task_key: bronze_ingestion
          job_cluster_key: sales_job_cluster
          spark_python_task:
            python_file: ../src/01_bronze_ingestion.py

        # Task 2: Silver Cleaning (depends on Bronze finishing first)
        - task_key: silver_cleaning
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: sales_job_cluster
          spark_python_task:
            python_file: ../src/02_silver_cleaning.py

        # Task 3: Gold Analytics (depends on Silver finishing first)
        - task_key: gold_analytics
          depends_on:
            - task_key: silver_cleaning
          job_cluster_key: sales_job_cluster
          spark_python_task:
            python_file: ../src/03_gold_analytics.py